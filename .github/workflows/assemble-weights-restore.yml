name: assemble-weights-restore
on:
  push:
    branches: [nvfp4-flash-next]
    paths:
      - '.tensorfold-restore/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nvfp4-flash-next
      - name: Assemble weights.py
        run: |
          set -euo pipefail
          cat .tensorfold-restore/weights.part0 .tensorfold-restore/weights.part1 .tensorfold-restore/weights.part2 .tensorfold-restore/weights.part3 > src/tensorfold/families/qwen4_exp/cuda/weights.py
          python3 - <<'PY'
          import hashlib
          c=open("src/tensorfold/families/qwen4_exp/cuda/weights.py").read()
          assert len(c)==35163, len(c)
          h=hashlib.sha256(c.encode()).hexdigest()
          assert h.startswith("e70318d56e30d629"), h
          assert "TENSORFOLD_NVFP4_DRAFT_HEAD" in c
          assert "b16_from_rows(rows)" in c
          assert "LOAD_FROM_" not in c
          print("OK", len(c), h[:16])
          PY
          rm -rf .tensorfold-restore
          rm -f .github/workflows/assemble-weights-restore.yml
          git config user.name "tournierjc"
          git config user.email "mail@tournierjc.fr"
          git add -A
          git commit -m "fix(nvfp4): restore full weights.py with BF16 draft head (undo LOAD_FROM stub)"
          git push
