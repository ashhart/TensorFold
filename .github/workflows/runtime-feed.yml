name: Desktop engine runtime publication

on:
  push:
    branches: [main]
    paths:
      - 'tools/runtime_release/**'
      - 'packaging/runtime-trust.json'
      - '.github/workflows/runtime-feed.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable engine tag to backfill, or latest
        default: latest
        required: true
        type: string
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-engine-runtime-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ashhart/TensorFold' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      state: ${{ steps.runtime.outputs.state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate the official engine and qualify the existing app protocol
        id: runtime
        env:
          TF_ENGINE_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -eu
          for attempt in 1 2 3; do
            candidate="$RUNNER_TEMP/runtime-attempt-$attempt"
            if node tools/runtime_release/prepare.mjs "$TF_ENGINE_TAG" "$candidate"; then
              mv "$candidate" "$RUNNER_TEMP/runtime-candidate"
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const status = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/runtime-candidate/status.json'));
          if (!['current', 'renew', 'prepared'].includes(status.state)) throw Error('Invalid runtime state');
          appendFileSync(process.env.GITHUB_OUTPUT, `state=${status.state}\n`);
          JS
      - name: Transfer only public verified artifacts to the signing job
        if: steps.runtime.outputs.state != 'current'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-desktop-runtime
          path: ${{ runner.temp }}/runtime-candidate/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: needs.prepare.outputs.state != 'current'
    runs-on: ubuntu-24.04
    environment: runtime-release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-desktop-runtime
          path: ${{ runner.temp }}/runtime-candidate/
      - name: Reverify, publish immutable runtime, sign feed and verify live discovery
        env:
          GH_TOKEN: ${{ github.token }}
          TF_RUNTIME_SIGNING_KEY: ${{ secrets.TF_RUNTIME_SIGNING_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node tools/runtime_release/publish.mjs "$RUNNER_TEMP/runtime-candidate" --publish; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Retain public publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-runtime-publication
          path: |
            ${{ runner.temp }}/runtime-candidate/publication.json
            ${{ runner.temp }}/runtime-candidate/catalog-*.json
          if-no-files-found: error
          retention-days: 30
