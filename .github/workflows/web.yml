name: TensorFold Web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  python:
    # the engine extra is not installed: TensorFold Web runs without it and the tests must too
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  package:
    # what a user installs: the wheel must carry the page and the data files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: pip install dist/*.whl
      - run: |
          cd / && python -c "import tensorfold_web.server as s; assert (s.UI_DIST / 'index.html').is_file(), 'no page in the wheel'; import tensorfold_web.catalog"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # the built page ships in the package, so it must match the sources
      - name: Built page is committed
        run: |
          git diff --exit-code -- ../tensorfold_web/ui_dist || { echo "tensorfold_web/ui_dist is stale; run npm run build in ui/ and commit"; exit 1; }
      - name: No untracked built files
        run: test -z "$(git status --porcelain -- ../tensorfold_web/ui_dist)"
