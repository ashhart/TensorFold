name: TensorFold

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest safetensors numpy mlx "tomli; python_version < '3.11'"

      - name: Product test suite
        run: |
          PYTHONPATH=src python -m pytest \
            tests/test_tensorfold_cli.py \
            tests/test_public_scrub.py \
            tests/test_tensorfold_release_manifest.py \
            tests/test_tensorfold_release_smoke.py \
            tests/test_safetensors_runtime.py \
            tests/test_weight_pager.py \
            -q

      - name: Public scrub
        run: PYTHONPATH=src python tools/check_public_scrub.py

      - name: Release smoke
        run: python tools/smoke_tensorfold_release.py
