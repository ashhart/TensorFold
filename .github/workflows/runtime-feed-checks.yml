name: Desktop runtime publisher tests
on:
  pull_request:
    paths:
      - 'tools/runtime_release/**'
      - 'packaging/runtime-trust.json'
      - '.github/workflows/runtime-feed*.yml'
      - '.github/workflows/runtime-release-trigger.yml'
  push:
    branches: [main]
    paths:
      - 'tools/runtime_release/**'
      - 'packaging/runtime-trust.json'
      - '.github/workflows/runtime-feed*.yml'
      - '.github/workflows/runtime-release-trigger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node --test tools/runtime_release/*.test.mjs
      - run: python3 -m unittest discover -s tools/runtime_release -p 'test_*.py'
