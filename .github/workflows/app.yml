name: App and mobile checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'

jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/mobile/package-lock.json
      - name: Use the package-manager pin
        run: npm install --global --ignore-scripts npm@10.9.8
      - name: Install locked desktop dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install mobile fixtures required by the shared test runner
        run: npm --prefix mobile ci --ignore-scripts
      - name: Desktop security and runtime tests
        run: npm test
      - name: Typecheck desktop
        run: npm run typecheck
      - name: Check patch whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi

  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/mobile/package-lock.json
      - name: Use the package-manager pin
        run: npm install --global --ignore-scripts npm@10.9.8
      - name: Install locked desktop dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install mobile fixtures required by the shared test runner
        run: npm --prefix mobile ci --ignore-scripts
      - name: Desktop security and runtime tests
        run: npm test
      - name: Typecheck desktop
        run: npm run typecheck
      - name: Check patch whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi

  appimage-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # electron-builder packages the real Electron runtime.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Use the package-manager pin
        run: npm install --global --ignore-scripts npm@10.9.8
      - name: Install locked desktop dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install Electron and rebuild node-pty
        run: npm run deps:trusted-scripts
      - name: Build the Ubuntu 24.04 AppImage
        run: npm run dist:linux
      - name: Clean-install smoke of the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 npm run smoke:linux:packaged -- --appimage
      - name: Upload the AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tensorfold-linux-appimage
          path: app/release/linux/*.AppImage
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/mobile/package-lock.json
      - name: Use the package-manager pin
        run: npm install --global --ignore-scripts npm@10.9.8
      - name: Install locked mobile dependencies without lifecycle scripts
        run: npm --prefix mobile ci --ignore-scripts
      - name: Validate mobile lock, security regressions, types and lint
        run: npm run verify:mobile
