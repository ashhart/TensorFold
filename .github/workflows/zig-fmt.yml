name: Zig format

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # a pull request push cancels that PR's older run (18 Nov: 28 superseded runs sat queued); main pushes all run
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A newer push to main or to a pull request cancels the older format run, as No GPU does.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 19 Nov: a landing train's PR (lead/train-*) skips these jobs. Our local CI runs the same checks on the train's
# tip, and the hosted queue (58 runs behind ~13 jobs) held main's and contributors' checks for hours. A train
# whose local run is red starts this workflow on its branch by hand (workflow_dispatch) for GitHub's verdict.
jobs:
  fmt:
    if: ${{ !startsWith(github.head_ref, 'lead/train-') }}  # a landing train's tip: see the note above jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      # zig fmt --check fails the pull request when Zig formatting drifts.
      - name: zig fmt
        run: zig fmt --check build.zig zig
