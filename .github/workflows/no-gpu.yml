name: No GPU

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # zig build test is the host unit tests. No GPU, and no Python suite.
      - name: zig build test
        run: zig build test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The host suite. CUDA and Metal tests skip where those are missing.
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: pytest
        run: python -m pytest -q tests
