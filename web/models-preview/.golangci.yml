# Lint rules from Go Fast Stack (github.com/jayleaton/go-fast-stack), trimmed to this app's layers.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - forbidigo
    - errorlint
    - intrange
    - misspell
    - mnd # a literal with meaning is a named, commented const
    - nilerr
    - noctx
    - paralleltest
    - tparallel
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^config\.APIRoutes$
          pkg: ^github\.com/ashhart/TensorFold/web/models-preview/internal/config$
          msg: the page never links to or fetches the JSON API; it calls apiclient.Client in-process
        - pattern: ^http\.(Client|DefaultClient|Get|Head|Post|PostForm)$
          pkg: ^net/http$
          msg: the UI makes no HTTP requests; the catalog's source adapter lives in internal/server
        - pattern: ^time\.Sleep$
          msg: tests never sleep; wait on a channel or condition, or use testing/synctest
    mnd:
      ignored-numbers: ["0", "1"]
    paralleltest:
      ignore-missing-subtests: true
    depguard:
      rules:
        services:
          files:
            - "**/internal/services/**"
          deny:
            - pkg: net/http
              desc: services are transport-agnostic; return *services.Error and let the transport map it
            - pkg: github.com/a-h/templ
              desc: rendering belongs to ui
            - pkg: github.com/starfederation/datastar-go
              desc: SSE belongs to ui
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/api
              desc: services never import a transport or its client
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/server
              desc: services reach adapters only through their ports
            - pkg: github.com/ashhart/TensorFold/web/models-preview/ui
              desc: services never import a transport
        api:
          files:
            - "**/internal/api/**"
          deny:
            - pkg: github.com/ashhart/TensorFold/web/models-preview/ui
              desc: the UI sits above the API
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/server
              desc: the API declares its service port; server wires it
        ui:
          files:
            - "**/ui/**"
          deny:
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/services
              desc: the UI reads data only through apiclient.Client
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/validate
              desc: the UI reads data only through apiclient.Client
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/api$
              desc: the UI reads data only through apiclient.Client
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/api/
              desc: the UI reads data only through apiclient.Client
            - pkg: github.com/ashhart/TensorFold/web/models-preview/internal/server
              desc: server wires the UI, never the other way
        no-test-helpers:
          files:
            - $all
            - "!$test"
            - "!**/mocks/**"
          deny:
            - pkg: go.uber.org/mock
              desc: mocks are for tests
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [noctx]
      - path-except: _test\.go
        linters: [forbidigo]
        text: tests never sleep
      - path-except: ui/
        linters: [forbidigo]
        text: the page never links to or fetches the JSON API
      - path-except: ui/
        linters: [forbidigo]
        text: the UI makes no HTTP requests

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ashhart/TensorFold/web/models-preview
