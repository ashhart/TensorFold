[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorfold-web"
version = "0.1.0"
description = "A local web interface for TensorFold: pick a model that fits, run it, watch it, chat, connect your tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "psutil>=5.9",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# no `engine` extra: PyPI refuses a dependency from Git, and the engine is TensorFold's native binary (Homebrew or
# its release archive); the frozen Python line, for models not yet native, is installed by hand (see the README)
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tensorfold-web = "tensorfold_web.cli:main"

[tool.setuptools.packages.find]
include = ["tensorfold_web*"]

[tool.setuptools.package-data]
"tensorfold_web.data" = ["*.json", "licenses/*.txt"]
"tensorfold_web.ui_dist" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
