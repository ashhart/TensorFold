groups:
  - name: starlight-availability
    rules:
      - alert: StarlightInstanceDown
        expr: up{job="starlight"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Starlight instance {{ $labels.instance }} is not answering scrapes"
      - alert: StarlightNoControllerLeader
        expr: (max(starlight_controller_epoch) or vector(0)) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No Starlight instance holds the controller lease, so placement, loading and reaping have stopped"
      - alert: StarlightCertificateExpiring
        expr: min by (certificate) (starlight_certificate_expiry_timestamp_seconds) - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.certificate }} certificate expires in {{ $value | humanizeDuration }}"

  - name: starlight-fleet
    rules:
      - alert: StarlightNodesStale
        expr: max(starlight_nodes{status="stale"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} active nodes have not synced for more than 90 seconds"
      - alert: StarlightNodesAwaitingApproval
        expr: max(starlight_nodes{status="pending"}) > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "{{ $value }} enrolled nodes are waiting for approval"
      - alert: StarlightReplicasFailed
        expr: max by (deployment) (starlight_replicas{state="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} has failed replicas"
      - alert: StarlightReplicasLost
        expr: max by (deployment) (starlight_replicas{state="lost"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} has replicas on nodes that stopped syncing"
      - alert: StarlightQueueDepthHigh
        expr: max by (model) (starlight_queue_depth) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} requests for {{ $labels.model }} are waiting for capacity"

  - name: starlight-traffic
    rules:
      - alert: StarlightHigh5xxRate
        expr: sum(rate(starlight_requests_total{status="5xx"}[5m])) / clamp_min(sum(rate(starlight_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of inference requests are failing with a server error"
      - alert: StarlightAdmissionRejectionsSpike
        expr: |
          sum(rate(starlight_admission_rejections_total{reason!~"unauthenticated|client_left"}[5m])) > 1
          and
          sum(rate(starlight_admission_rejections_total{reason!~"unauthenticated|client_left"}[5m]))
            > 3 * sum(rate(starlight_admission_rejections_total{reason!~"unauthenticated|client_left"}[1h] offset 5m))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Requests refused before dispatch are at more than three times the previous hour's rate"
      - alert: StarlightCapacityExhausted
        expr: sum by (reason) (rate(starlight_admission_rejections_total{reason="capacity"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Requests are timing out in the admission queue; add replicas or raise max_replicas"
      - alert: StarlightNoRoute
        expr: sum(rate(starlight_admission_rejections_total{reason="no_route"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests are refused because no deployment or provider may serve them"
      - alert: StarlightQueueWaitHigh
        expr: histogram_quantile(0.95, sum by (le, model) (rate(starlight_queue_wait_seconds_bucket[10m]))) > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile queue wait for {{ $labels.model }} is above 15 seconds"
      - alert: StarlightUnauthenticatedSurge
        expr: sum(rate(starlight_admission_rejections_total{reason="unauthenticated"}[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than five requests a second carry invalid credentials; check for leaked or guessed keys"
