# Fleet file for `starlight apply -f`, separate from the server's configuration file; apply creates or updates what it names.
version: 1

settings:
  org_name: Example Corp
  offline: false
  audit_retention_days: 400

providers:
  - name: openai-main
    kind: openai
    credential: env:OPENAI_API_KEY
    max_classification: internal
  - name: anthropic-main
    kind: anthropic
    credential: file:/etc/starlight/credentials/anthropic
    max_classification: confidential
    region: us

models:
  - name: team/coder-large
    display_name: Coder Large
    description: Coding model served on the Mac pool first, with a frontier fallback.
    route_policy: local_first
    capabilities:
      context_window: 131072
      tools: true
      reasoning: true
    everyone: true
    aliases: [coder]
    deployments:
      - name: coder-large-mac
        pool: mac
        mode: warm
        min_replicas: 1
        max_replicas: 2
        selector:
          chip: m3-ultra
        spec:
          model:
            kind: hf
            repo: example-org/coder-large
            revision: 0123456789abcdef0123456789abcdef01234567
          backend: metal
          context: 131072
          parallel: 8
    routes:
      - provider: anthropic-main
        upstream_model: frontier-large
        priority: 100
  - name: team/wide
    display_name: Wide model
    description: Too large for one GPU, so each replica runs two tensor-parallel ranks on a B300 node.
    route_policy: local_only
    everyone: false
    deployments:
      - name: wide-b300
        pool: gpu
        mode: warm
        min_replicas: 2
        max_replicas: 4
        spec:
          model:
            kind: hf
            repo: example-org/wide-nvfp4
            revision: 89abcdef0123456789abcdef0123456789abcdef
          backend: cuda
          gpus: 2
          tensor_parallel: glm
          memory_gib: 360
          context: 245760
  - name: team/embed
    kind: embedding
    route_policy: local_only
    everyone: true
    deployments:
      - name: embed-gpu
        pool: gpu
        mode: on_demand
        min_replicas: 0
        max_replicas: 2
        idle_seconds: 900
        spec:
          model:
            kind: path
            path: /srv/models/embed
          backend: cuda

projects:
  - slug: research
    name: Research
    description: Applied research team.
    classification: confidential
    isolate_prompt_cache: true
    plan_approval: required
    secrets_guard: local
    service_accounts:
      - name: ci-runner
        description: Build and test agents
    members:
      - user: lead@example.com
        role: project_admin
      - group: {connection: okta, id: research-engineers}
        role: member
      - service_account: ci-runner
        role: member
    models:
      - model: team/coder-large
        max_output_tokens: 16384
    aliases:
      frontier-coder: team/coder-large
    limits:
      - kind: tokens_per_day
        value: 5000000
      - kind: requests_per_minute
        scope: member
        value: 60

limits:
  - kind: concurrency
    value: 256
  - kind: cost_per_month
    value: "2500.00"

org_roles:
  - user: platform@example.com
    role: fleet_operator
  - group: {connection: okta, id: starlight-auditors}
    role: auditor
