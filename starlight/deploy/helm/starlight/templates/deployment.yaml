apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "starlight.fullname" . }}
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "starlight.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "starlight.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "starlight.serviceAccount" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 45
      containers:
        - name: starlight
          image: {{ include "starlight.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: STARLIGHT_CONFIG
              value: /etc/starlight/starlight.yaml
            {{- include "starlight.secretEnv" . | nindent 12 }}
          ports:
            - name: public
              containerPort: 8443
            - name: nodes
              containerPort: 9443
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/starlight
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/starlight
              readOnly: true
            {{- if .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/starlight/tls
              readOnly: true
            {{- end }}
            {{- if .Values.identityCA.configMapName }}
            - name: idp-ca
              mountPath: /etc/starlight/idp-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "starlight.fullname" . }}
        {{- include "starlight.secretVolume" . | nindent 8 }}
        {{- if .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.identityCA.configMapName }}
        - name: idp-ca
          configMap:
            name: {{ .Values.identityCA.configMapName }}
            items:
              - key: {{ .Values.identityCA.key }}
                path: ca.pem
        {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "starlight.selector" . | nindent 20 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
