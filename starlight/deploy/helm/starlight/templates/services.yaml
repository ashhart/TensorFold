apiVersion: v1
kind: Service
metadata:
  name: {{ include "starlight.fullname" . }}
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
  {{- with .Values.service.public.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.public.type }}
  selector:
    {{- include "starlight.selector" . | nindent 4 }}
  ports:
    - name: public
      port: {{ .Values.service.public.port }}
      targetPort: public
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "starlight.fullname" . }}-nodes
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
  {{- with .Values.service.nodes.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.nodes.type }}
  {{- with .Values.service.nodes.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "starlight.selector" . | nindent 4 }}
  ports:
    - name: nodes
      protocol: TCP
      port: {{ .Values.service.nodes.port }}
      targetPort: nodes
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "starlight.fullname" . }}-metrics
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "starlight.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
