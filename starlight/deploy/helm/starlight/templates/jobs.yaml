{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "starlight.fullname" . }}-migrate
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "starlight.image" . }}
          args: ["migrate"]
          env:
            - name: STARLIGHT_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            {{- include "starlight.secretEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/starlight
              readOnly: true
      volumes:
        {{- include "starlight.secretVolume" . | nindent 8 }}
{{- end }}
{{- if .Values.initialise.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "starlight.fullname" . }}-init
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: init
          image: {{ include "starlight.image" . }}
          args:
            - init
            - --org
            - {{ .Values.initialise.org | quote }}
            {{- if .Values.initialise.offline }}
            - --offline
            {{- end }}
          env:
            - name: STARLIGHT_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            {{- include "starlight.secretEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/starlight
              readOnly: true
      volumes:
        {{- include "starlight.secretVolume" . | nindent 8 }}
{{- end }}
