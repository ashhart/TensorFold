{{- $cfg := dict "public_url" .Values.publicURL "node_url" .Values.nodeURL "roles" .Values.roles "trusted_proxies" .Values.trustedProxies -}}
{{- $_ := set $cfg "listen" (dict "public" ":8443" "nodes" ":9443" "metrics" ":9090") -}}
{{- if .Values.tls.secretName -}}
{{- $_ := set $cfg "tls" (dict "cert_file" "/etc/starlight/tls/tls.crt" "key_file" "/etc/starlight/tls/tls.key") -}}
{{- end -}}
{{- if .Values.identityCA.configMapName -}}
{{- $_ := set $cfg "identity" (dict "ca_file" "/etc/starlight/idp-ca/ca.pem") -}}
{{- end -}}
{{- if .Values.secrets.metricsTokenKey -}}
{{- $_ := set $cfg "metrics" (dict "bearer_token_file" "/run/secrets/starlight/metrics-token") -}}
{{- end -}}
{{- $cfg = mergeOverwrite $cfg .Values.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "starlight.fullname" . }}
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
data:
  starlight.yaml: |
    {{- toYaml $cfg | nindent 4 }}
