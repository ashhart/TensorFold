{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "starlight.fullname" . }}
  labels:
    {{- include "starlight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "starlight.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: public
        - port: nodes
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 12 }}
      ports:
        - port: metrics
{{- end }}
