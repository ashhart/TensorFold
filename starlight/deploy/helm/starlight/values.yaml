image:
  repository: tensorfold/starlight
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
roles: [gateway, control, console, scim]

publicURL: https://ai.example.com
nodeURL: https://starlight-nodes.example.com:9443
trustedProxies: ["10.0.0.0/8"]

secrets:
  name: starlight-secrets
  databaseURLKey: database-url
  masterKeyKey: master-key
  metricsTokenKey: ""

tls:
  secretName: ""

identityCA:
  configMapName: ""
  key: ca.pem

config: {}

initialise:
  enabled: true
  org: Example Corp
  offline: false

migrations:
  enabled: true

service:
  public:
    type: ClusterIP
    port: 443
    annotations: {}
  nodes:
    type: LoadBalancer
    port: 9443
    annotations: {}
    loadBalancerSourceRanges: []
  metrics:
    port: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ai.example.com
  tlsSecretName: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  metricsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
