name: tensorfold-starlight

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: starlight
      POSTGRES_DB: starlight
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starlight -d starlight"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  starlight:
    image: ${STARLIGHT_IMAGE:-tensorfold/starlight:dev}
    build:
      context: ../..
      dockerfile: deploy/starlight/Dockerfile
    user: "${STARLIGHT_UID:-65532}:${STARLIGHT_GID:-65532}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STARLIGHT_CONFIG: /etc/starlight/starlight.yaml
      STARLIGHT_PUBLIC_URL: ${STARLIGHT_PUBLIC_URL:-http://localhost:8443}
      STARLIGHT_NODE_URL: ${STARLIGHT_NODE_URL:-}
      STARLIGHT_DATABASE_URL_FILE: /run/secrets/database_url
      STARLIGHT_MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [database_url, master_key]
    volumes:
      - ./starlight.yaml:/etc/starlight/starlight.yaml:ro
    ports:
      - "${STARLIGHT_PUBLIC_PORT:-8443}:8443"
      - "${STARLIGHT_NODE_PORT:-9443}:9443"
      - "127.0.0.1:8080:8080"
    command: ["serve", "--migrate"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.0.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run bootstrap.sh first}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  keycloak:
    profiles: [idp]
    image: quay.io/keycloak/keycloak:26.0.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    user: "${STARLIGHT_UID:-1000}:0"
    network_mode: "service:starlight"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run bootstrap.sh first}
    volumes:
      - ./secrets/keycloak-realm.json:/opt/keycloak/data/import/example-realm.json:ro
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres-password
  database_url:
    file: ./secrets/database-url
  master_key:
    file: ./secrets/master-key

volumes:
  postgres: {}
  prometheus: {}
  grafana: {}
