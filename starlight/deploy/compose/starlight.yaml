roles: [gateway, control, console, scim]
listen:
  public: ":8443"
  nodes: ":9443"
  metrics: ":9090"
trusted_proxies: []
sessions:
  console_idle: 30m
  console_absolute: 12h
  access_ttl: 10m
  auth_cache: 15s
gateway:
  max_body_bytes: 33554432
  queue_interactive: 30s
  queue_standard: 2m
  queue_batch: 15m
  default_max_tokens: 4096
log:
  level: info
  format: json
