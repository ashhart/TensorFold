{{define "content"}}{{$p := .Page}}<link rel="stylesheet" href="{{asset "fleet.css"}}">
<h1>{{.Title}}</h1>
<p class="lede">{{$p.Label}}</p>
<p class="secret" aria-label="Secret value">{{$p.Value}}</p>
{{if $p.Command}}<h2>Command</h2><p class="code">{{$p.Command}}</p>{{end}}
<p class="small">Store it now. Starlight keeps only a hash and cannot show it again.</p>
<p><a class="button inline primary" href="{{$p.Back}}">Done</a></p>
{{end}}
