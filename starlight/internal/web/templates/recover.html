{{define "body"}}{{$p := .Page}}
<h1>Break-glass sign-in</h1>
<p class="lede">This one-time link signs an owner in without single sign-on. Use it only to repair sign-in.</p>
{{if $p.Error}}<p class="error" role="alert">{{$p.Error}}</p>{{end}}
<form method="post" action="/auth/recover" class="stack">
<input type="hidden" name="code" value="{{$p.Code}}">
<button type="submit" class="primary">Sign in as owner</button>
</form>
<p class="small">Every use is recorded in the audit log.</p>
{{end}}
