{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex">
<title>{{.Title}} · {{.Org}}</title>
<link rel="icon" type="image/png" href="{{asset "favicon-32.png"}}">
<link rel="stylesheet" href="{{asset "starlight.css"}}">
</head>
<body>
<main class="shell">
<header class="brand">
<img src="{{asset "logo-128.png"}}" alt="TensorFold" width="56" height="56">
<div><span class="org">{{.Org}}</span><span class="product">TensorFold Starlight</span></div>
</header>
<section class="card">
{{template "body" .}}
</section>
<footer class="foot">{{if .RequestID}}Reference {{.RequestID}}{{end}}</footer>
</main>
</body>
</html>
{{end}}
