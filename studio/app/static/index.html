<style>

  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px); background-size:44px 44px;
  mask-image:linear-gradient(to bottom,#000,transparent 70%); -webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%); }
header, main { position:relative; z-index:1; }

/* which build this is, hard to miss: a neon plate whose glow swells and dims slowly while its gradient drifts */
.plat { --neon:#67e3ff; --neon2:#8f7dff; position:relative; font:800 13.5px var(--mono); letter-spacing:.09em; padding:7px 16px 7px 30px; border-radius:999px;

  background-size:300% 100%; text-shadow:0 0 8px var(--neon),0 0 18px color-mix(in srgb,var(--neon) 70%,transparent);

.plat:empty { display:none; }

  to { box-shadow:0 0 0 1px color-mix(in srgb,var(--neon) 55%,transparent),0 0 26px 4px color-mix(in srgb,var(--neon) 75%,transparent),0 0 54px 10px color-mix(in srgb,var(--neon2) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--neon) 38%,transparent); } }
@keyframes plat-drift { from { background-position:0% 0; } to { background-position:300% 0; } }
@keyframes plat-dot { from { opacity:.55; box-shadow:0 0 5px 1px color-mix(in srgb,var(--neon) 60%,transparent); } to { opacity:1; box-shadow:0 0 14px 4px var(--neon); } }

  transition:background .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease); }

  transition:border-color .18s var(--ease),box-shadow .18s var(--ease); }

::placeholder { color:#5b617a; }
.row { display:flex; gap:12px; align-items:end; flex-wrap:wrap; } .row > * { flex:1; min-width:120px; } .row > .fit { flex:0 0 auto; min-width:0; }
.steps { display:flex; gap:0; margin:-4px 0 18px; padding:4px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); flex-wrap:wrap; }

/* choice groups: one decision, every option visible */
.choice { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.choice button { text-align:left; padding:11px 13px; border-radius:12px; background:rgba(255,255,255,.028); display:flex; flex-direction:column; gap:2px; min-height:58px; justify-content:center; position:relative; }

.choice button.on { border-color:transparent; background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--grad) border-box; border:1px solid transparent; box-shadow:0 0 0 3px rgba(103,227,255,.09),0 10px 30px -18px rgba(103,227,255,.9); }

.choice button:disabled { opacity:.35; }
.choice.tight { grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); } .choice.tight button { min-height:48px; padding:8px 11px; }
.group { border:1px solid var(--line); border-radius:14px; padding:4px 16px 16px; margin-top:14px; background:rgba(255,255,255,.018); }

.summary .chip.k { border-color:transparent; background:var(--grad); color:#070810; font-weight:700; } .summary .eta { margin-left:auto; color:var(--accent); font-weight:600; }
.switch { display:flex; gap:12px; align-items:center; padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.028); cursor:pointer; text-transform:none; letter-spacing:0; font-size:13px; color:var(--text); font-weight:500; margin:0; min-height:48px; }

.switch input { appearance:none; height:22px; -webkit-appearance:none; width:38px; height:22px; border-radius:999px; background:#2a2f45; border:0; position:relative; padding:0; flex:none; cursor:pointer; transition:background .2s var(--ease); }

.switch input:checked { background:var(--accent2); background-image:var(--grad); } .switch input:checked::after { transform:translateX(16px); background:#070810; }
.switch input:disabled { opacity:.4; cursor:default; } .switch small { display:block; color:var(--dim); font-size:11.5px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.tile { background:var(--panel2); border:1px solid var(--line); border-radius:12px; overflow:hidden; transition:transform .18s var(--ease),border-color .18s var(--ease); }
.tile .cap > :first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tile .cap button, .tile .cap a { white-space:nowrap; flex:none; }
.tile:hover { transform:translateY(-2px); border-color:var(--line2); } .tile.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset,0 12px 34px -18px rgba(103,227,255,.9); }

.strip { display:flex; height:34px; border-radius:9px; overflow:hidden; border:1px solid var(--line); margin:8px 0; } .strip div { background:linear-gradient(180deg,rgba(143,125,255,.35),rgba(103,227,255,.18)); border-right:1px solid var(--ink); font-size:11px; padding:7px 8px; overflow:hidden; white-space:nowrap; }
video.main { width:100%; background:#000; border-radius:12px; max-height:52vh; border:1px solid var(--line); }
.tl { display:flex; gap:8px; overflow-x:auto; padding:10px; background:rgba(4,5,9,.6); border:1px solid var(--line); border-radius:12px; min-height:112px; }
.clip { flex:0 0 190px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:7px; font-size:12px; } .clip.on { border-color:var(--warn); }

.hub { margin:10px 0; } .hub .chips { margin:6px 0; } button.lora.on { background:rgba(255,196,84,.16); border-color:rgba(255,205,110,.8); color:#ffe9b8; box-shadow:0 0 12px rgba(255,186,60,.35); }

.hubtabs { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; } .hubtabs button.on { border-color:rgba(255,205,110,.8); color:#ffe9b8; background:rgba(255,196,84,.12); }

.list button.on { border-color:var(--accent); background:rgba(103,227,255,.07); } .list button span { display:block; color:var(--dim); font-size:11.5px; line-height:1.35; }

  border:1px solid var(--accent); background:rgba(14,17,28,.96); box-shadow:0 18px 50px -12px rgba(0,0,0,.9),0 0 0 3px rgba(103,227,255,.1); }
