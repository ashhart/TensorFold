[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorfold"
dynamic = ["version"]
description = "Fast, exact LLM decoding on Apple Silicon (MLX) and NVIDIA GPUs (CUDA) behind an OpenAI-compatible endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TensorFold contributors" }]
keywords = ["llm", "mlx", "apple-silicon", "cuda", "dgx-spark", "inference", "speculative-decoding", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: GPU :: NVIDIA CUDA",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# mlx-lm stays below its next minor (TensorFold builds on its models); CUDA uses the container's torch and triton.
dependencies = [
  "mlx>=0.32.2; sys_platform == 'darwin'",
  "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin'",
  "numpy>=1.26",
  "huggingface-hub>=0.24",
  "tokenizers>=0.20; sys_platform != 'darwin'",
  "safetensors>=0.4; sys_platform != 'darwin'",
  "jinja2>=3.1; sys_platform != 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tensorfold = "tensorfold.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tensorfold.drafters.vendor.z_lab_dflash" = ["README.md"]
"tensorfold.cuda" = ["*.cu", "*.cuh", "*.cpp"]
"tensorfold.cuda.kernels" = ["*.cu", "*.cuh", "*.cpp"]
"tensorfold.families.qwen3_5" = ["*.json"]
"tensorfold.families.qwen4_exp.cuda" = ["*.cu", "*.cpp", "*.txt"]
"tensorfold.families.nemotron_h" = ["*.txt"]
"tensorfold.families.glm5_next.cuda" = ["*.cu", "*.cpp"]
"tensorfold.families.nemotron_h.cuda" = ["*.cu", "*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.setuptools.dynamic]
version = { attr = "tensorfold.__version__" }
